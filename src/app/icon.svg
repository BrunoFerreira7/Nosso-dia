<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAC435"/>
      <stop offset="50%" style="stop-color:#FFAAEA"/>
      <stop offset="100%" style="stop-color:#FB4D3D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cake body -->
  <rect x="156" y="260" width="200" height="180" rx="12" fill="url(#cakeGrad)" filter="url(#glow)"/>
  <!-- Cake top layer -->
  <rect x="176" y="220" width="160" height="50" rx="8" fill="#EAC435" opacity="0.8"/>
  <!-- Frosting drips -->
  <path d="M156 260 Q176 240 196 260 Q216 240 236 260 Q256 240 276 260 Q296 240 316 260 Q336 240 356 260" fill="#FFAAEA"/>
  <!-- Candle -->
  <rect x="246" y="180" width="20" height="45" rx="3" fill="#98C1D9"/>
  <!-- Flame -->
  <ellipse cx="256" cy="172" rx="10" ry="16" fill="#EAC435">
    <animate attributeName="rx" values="10;12;10" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="16;18;16" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="256" cy="175" rx="5" ry="8" fill="#FB4D3D"/>
  <!-- Dots on cake -->
  <circle cx="206" cy="290" r="3" fill="#FFAAEA"/>
  <circle cx="306" cy="310" r="3" fill="#FFAAEA"/>
  <circle cx="256" cy="350" r="3" fill="#EAC435"/>
  <circle cx="226" cy="380" r="3" fill="#98C1D9"/>
  <circle cx="286" cy="375" r="3" fill="#98C1D9"/>
  <!-- Plate -->
  <ellipse cx="256" cy="440" rx="130" ry="12" fill="#FFAAEA" opacity="0.3"/>
</svg>
